generated: '2026-07-21'
method: searched
source: https://docs.zerosettle.io/iap/installation
description: >-
  First-party ZeroSettle client SDKs for integrating web checkout, entitlements,
  and subscription lifecycle into mobile apps. All wrap the ZeroSettle IAP API
  (X-ZeroSettle-Key auth). React Native is currently iOS-only and one minor
  version behind the native SDKs.
packages:
- name: ZeroSettleKit
  registry: swift-package-manager
  ecosystem: swift
  official: true
  platform: iOS
  url: https://github.com/zerosettle/ZeroSettleKit
  install: '.package(url: "https://github.com/zerosettle/ZeroSettleKit", from: "1.4.0")'
  also_available:
  - cocoapods
  min_version: '1.4.0'
  requires: iOS 17.0+, Swift 5.9+, Xcode 15.0+
  source: https://github.com/zerosettle/ZeroSettleKit
- name: io.zerosettle:zerosettle-android
  registry: maven-central
  ecosystem: java
  official: true
  platform: Android
  url: https://central.sonatype.com/artifact/io.zerosettle/zerosettle-android
  install: 'implementation("io.zerosettle:zerosettle-android:1.1.1")'
  version: '1.1.1'
  requires: Android API 26+ (Android 8.0), Kotlin 1.9+
  source: https://github.com/zerosettle/ZeroSettle-Android
- name: zerosettle
  registry: pub.dev
  ecosystem: dart
  official: true
  platform: Flutter
  url: https://pub.dev/packages/zerosettle
  install: 'flutter pub add zerosettle'
  version: '1.7.0'
  requires: Flutter 3.3.0+, iOS 17.0+ and/or Android API 26+
  source: https://github.com/zerosettle/ZeroSettle-Flutter
  notes: Wraps native ZeroSettleKit (iOS) and zerosettle-android (Android) via CocoaPods + Maven Central.
- name: react-native-zerosettle
  registry: npm
  ecosystem: javascript
  official: true
  platform: React Native
  url: https://www.npmjs.com/package/react-native-zerosettle
  install: 'npm install react-native-zerosettle@^1.1.0'
  version: '^1.1.0'
  requires: React Native 0.76+ (New Architecture / TurboModules), iOS 17.0+
  source: https://github.com/ZeroSettle/ZeroSettle-ReactNative
  notes: iOS-only; wraps ZeroSettleKit 1.3.x (one minor behind native SDKs). Android not yet supported.
