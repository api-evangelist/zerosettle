aid: zerosettle
name: ZeroSettle
description: >-
  ZeroSettle is a Y Combinator-backed subscription revenue platform that lets iOS,
  Android, Flutter, and React Native app developers offer direct web billing as an
  alternative to App Store and Google Play in-app purchase — the pitch is "keep 85%
  of your revenue, not 70%." As Merchant of Record (on Stripe Connect, or BYOS), it
  handles web checkout, entitlements, subscription lifecycle, StoreKit transaction
  syncing, retention cancel flows, upgrade/migration offers, and compliance
  external-purchase reporting. The ZeroSettle IAP API (REST/JSON, X-ZeroSettle-Key
  auth) powers all of its client SDKs, with a free tier plus a $29/month Pro plan.
